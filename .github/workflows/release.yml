name: Build marketplace package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build DeepWorkAI.exe
        run: python -m PyInstaller packaging/DeepWorkAI.spec --distpath build/app --workpath build/work --noconfirm

      - name: Smoke test the packaged app
        run: python packaging/smoke_test.py build/app/DeepWorkAI/DeepWorkAI.exe

      - name: Pack the plugin (.lplug4)
        working-directory: deepworkai/plugin
        run: |
          npm ci
          npm run build:prod
          npx logitoolkit pack

      - uses: actions/upload-artifact@v4
        with:
          name: DeepWorkAi-lplug4
          path: deepworkai/plugin/*.lplug4

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deepworkai/plugin/*.lplug4
