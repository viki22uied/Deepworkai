author: Vignesh Kumar U
minimumLoupedeckVersion: 6.1

pluginType: remote
pluginRuntime: nodejs
entryPoint: index.mjs

# Windows only: the plugin starts the bundled Deep Work AI app (DeepWorkAI.exe).
supportedDevices:
